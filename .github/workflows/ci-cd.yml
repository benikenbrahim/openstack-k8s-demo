
name: CI/CD - OpenStack Kubernetes

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "clusters/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/benikenbrahim/openstack-k8s-demo:${{ github.sha }}
            ghcr.io/benikenbrahim/openstack-k8s-demo:latest

      - name: Update Kubernetes manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s|ghcr.io/benikenbrahim/openstack-k8s-demo:[^[:space:]]+|ghcr.io/benikenbrahim/openstack-k8s-demo:${IMAGE_TAG}|" \
            k8s/deployment.yaml

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: deploy image ${{ github.sha }} [skip ci]"
            git push
          fi

