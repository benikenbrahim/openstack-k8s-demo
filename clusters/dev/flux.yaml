
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openstack-demo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/benikenbrahim/openstack-k8s-demo
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openstack-demo
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: default
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: openstack-demo
